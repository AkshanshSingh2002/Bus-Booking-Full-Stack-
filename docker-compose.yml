services:

  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:7.2
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # ============================================================
  # REDIS INSIGHT
  # ============================================================

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis

  # ============================================================
  # KAFKA
  # ============================================================
  
  kafka:
    image: apache/kafka:4.0.0
    container_name: bus-booking-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-data:/var/lib/kafka/data


  # ============================================================
  # OPENTELEMETRY COLLECTOR
  # ============================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"


  # ============================================================
  # PROMETHEUS
  # ============================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro

    ports:
      - "9090:9090"

    depends_on:
      - otel-collector


  # ============================================================
  # GRAFANA
  # ============================================================

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    depends_on:
      - prometheus
      - tempo


  # ============================================================
  # TEMPO
  # ============================================================

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped

    command:
      - "-config.file=/etc/tempo.yaml"

    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro

    ports:
      - "3200:3200"


  # ============================================================
  # ELASTICSEARCH
  # ============================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
    container_name: elasticsearch
    restart: unless-stopped

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data


  # ============================================================
  # KIBANA
  # ============================================================

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.2
    container_name: kibana
    restart: unless-stopped

    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

    ports:
      - "5601:5601"

    depends_on:
      - elasticsearch


# ==============================================================
# VOLUMES
# ==============================================================

volumes:

  redis-data:

  kafka-data:

  elasticsearch-data: